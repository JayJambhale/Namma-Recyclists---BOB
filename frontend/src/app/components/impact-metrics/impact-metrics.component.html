<!-- impact-metrics.component.html -->
<section class="space-y-3">
  <h2 class="text-sm font-semibold uppercase tracking-widest text-slate-500">
    Impact Metrics
  </h2>

  <!-- Loading skeleton -->
  @if (!property()) {
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      @for (_ of [1, 2, 3]; track $index) {
        <div class="animate-pulse rounded-xl border bg-slate-100 h-28"></div>
      }
    </div>
  }

  <!-- Metric cards -->
  @if (property()) {
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      @for (card of metrics(); track card.label) {
        <div
          class="flex items-start gap-4 rounded-xl border p-5 shadow-sm transition-shadow hover:shadow-md"
          [ngClass]="card.bgClass"
        >
          <span [ngClass]="card.colorClass" [innerHTML]="card.icon"></span>
          <div class="min-w-0">
            <p class="text-xs text-slate-500 truncate">{{ card.label }}</p>
            <p class="text-3xl font-bold leading-tight" [ngClass]="card.colorClass">
              {{ card.value }}
              <span class="text-sm font-normal text-slate-400 ml-1">{{ card.unit }}</span>
            </p>
          </div>
        </div>
      }
    </div>
  }
</section>
